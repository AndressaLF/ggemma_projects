<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Demo batimetria_kml_shape  planilha para mapa</title>
  <desc id="desc">Fluxo ilustrativo: planilha com coordenadas e profundidade vira KML ou shapefile.</desc>
  <rect width="900" height="360" rx="12" fill="#112240"/>

  <!-- spreadsheet -->
  <rect x="36" y="56" width="250" height="248" rx="10" fill="#0a1628" stroke="#1e3a5f"/>
  <text x="56" y="88" fill="#e2e8f0" font-size="16" font-weight="700" font-family="Segoe UI, Arial">planilha.xlsx</text>
  <rect x="56" y="108" width="210" height="28" rx="4" fill="#1a3358"/>
  <text x="66" y="127" fill="#38bdf8" font-size="12" font-family="Consolas, monospace">lon   lat   z</text>
  <text x="66" y="168" fill="#cbd5e1" font-size="12" font-family="Consolas, monospace">-43.12  -22.91  -14.2</text>
  <text x="66" y="192" fill="#cbd5e1" font-size="12" font-family="Consolas, monospace">-43.11  -22.90  -18.7</text>
  <text x="66" y="216" fill="#cbd5e1" font-size="12" font-family="Consolas, monospace">-43.10  -22.89  -25.1</text>
  <text x="66" y="240" fill="#cbd5e1" font-size="12" font-family="Consolas, monospace">-43.09  -22.88  -31.4</text>
  <text x="66" y="275" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial">CSV · TXT · XYZ · Excel</text>

  <!-- arrow -->
  <path d="M310 180 H390" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
  <path d="M378 168 L402 180 L378 192" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="318" y="160" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial">converte</text>

  <!-- tool -->
  <rect x="410" y="120" width="160" height="120" rx="12" fill="#0d2138" stroke="#38bdf8"/>
  <text x="430" y="170" fill="#38bdf8" font-size="14" font-weight="700" font-family="Segoe UI, Arial">batimetria</text>
  <text x="430" y="192" fill="#38bdf8" font-size="14" font-weight="700" font-family="Segoe UI, Arial">_kml_shape</text>
  <text x="430" y="220" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial">100% local</text>

  <!-- arrow 2 -->
  <path d="M590 180 H670" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
  <path d="M658 168 L682 180 L658 192" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="160" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial">gera</text>

  <!-- outputs -->
  <rect x="690" y="56" width="174" height="100" rx="10" fill="#0a1628" stroke="rgba(52,211,153,0.4)"/>
  <text x="710" y="96" fill="#34d399" font-size="15" font-weight="700" font-family="Segoe UI, Arial">.kml</text>
  <text x="710" y="122" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial">Google Earth</text>

  <rect x="690" y="180" width="174" height="124" rx="10" fill="#0a1628" stroke="rgba(56,189,248,0.4)"/>
  <text x="710" y="220" fill="#38bdf8" font-size="15" font-weight="700" font-family="Segoe UI, Arial">.shp</text>
  <text x="710" y="246" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial">CA_& área</text>
  <text x="710" y="268" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial">L_& linhas</text>

  <text x="36" y="36" fill="#e2e8f0" font-size="18" font-weight="700" font-family="Segoe UI, Arial">Planilha ’ mapa · sem montar na mão</text>
</svg>
